name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit
      - name: Package an unpacked Linux application
        run: npm run pack -- --linux --x64
      - name: Verify packaged contents and Electron fuses
        run: node scripts/verify-package.js release-builds
