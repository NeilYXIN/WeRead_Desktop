<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./styles.css" rel="stylesheet">
    <title>WeRead is unavailable</title>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">文</div>
      <h1>WeRead is unavailable</h1>
      <p>The website could not be loaded. Check your connection, then try again.</p>
      <div class="actions">
        <a class="primary" href="https://weread.qq.com/">Retry</a>
        <a href="https://weread.qq.com/" target="_blank" rel="noopener noreferrer">Open in browser</a>
      </div>
      <p class="hint" id="connection-status">You can also retry from the Navigation menu.</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
