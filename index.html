<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./styles.css" rel="stylesheet">
    <title>WeRead Desktop</title>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">文</div>
      <h1>Welcome to WeRead Desktop</h1>
      <p>A focused desktop window for the official WeRead website. An internet connection is needed to browse your library and read books.</p>
      <div class="actions">
        <a class="primary" href="https://weread.qq.com/">Continue to WeRead</a>
        <a href="https://weread.qq.com/" target="_blank" rel="noopener noreferrer">Open official website</a>
      </div>
      <p class="hint" id="connection-status">When your connection is ready, select Continue.</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
